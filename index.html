<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>読譜トレーニング</title>
  </head>
  <body>
    <header>
      <h1>読譜トレーニング <span class="mode">反射モード・ト音記号</span></h1>
      <div id="midi-status" class="midi-status">MIDI を確認中…</div>
    </header>

    <main>
      <section id="setup" class="panel" hidden>
        <form id="settings">
          <fieldset>
            <legend>出題の長さ</legend>
            <label class="radio"><input type="radio" name="limitKind" value="count" /> 問題数で区切る</label>
            <label class="radio"><input type="radio" name="limitKind" value="time" /> 時間で区切る</label>
            <label>問題数 <input id="count" type="number" min="1" max="500" /> 問</label>
            <label>制限時間 <input id="seconds" type="number" min="10" max="3600" step="10" /> 秒</label>
          </fieldset>
          <fieldset>
            <legend>出題範囲・判定</legend>
            <label>加線
              <select id="ledger">
                <option value="0">なし（D4〜G5）</option>
                <option value="1">1本まで（B3〜B5）</option>
                <option value="2">2本まで（G3〜D6）</option>
                <option value="3">3本まで（E3〜F6）</option>
              </select>
            </label>
            <label class="check"><input id="octave-eq" type="checkbox" /> オクターブ違いを正解とみなす</label>
          </fieldset>
        </form>
        <button id="start" class="primary">はじめる <kbd>Enter</kbd></button>
      </section>

      <section id="practice" class="panel" hidden>
        <div class="practice-head">
          <div id="progress"></div>
          <button id="stop">終了 <kbd>Esc</kbd></button>
        </div>
        <div id="staff" class="staff"></div>
        <div class="practice-foot">
          <div id="feedback" aria-live="polite"></div>
          <div id="reaction"></div>
        </div>
      </section>

      <section id="result" class="panel" hidden>
        <h2>結果</h2>
        <div id="summary" class="summary"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>出題</th><th>最初に押した音</th><th>反応時間</th><th>押した回数</th></tr></thead>
            <tbody id="answers"></tbody>
          </table>
        </div>
        <div class="actions">
          <button id="again" class="primary">もう一度</button>
          <button id="back">設定に戻る</button>
        </div>
      </section>
    </main>

    <footer>
      <div id="keyboard"></div>
      <div id="octave" class="hint"></div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
