<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>読譜トレーニング</title>
  </head>
  <body>
    <header>
      <h1>読譜トレーニング <span id="mode-label" class="mode">反射モード</span></h1>
      <div id="midi-status" class="midi-status">MIDI を確認中…</div>
    </header>

    <main>
      <section id="setup" class="panel" hidden>
        <form id="settings">
          <fieldset>
            <legend>譜表</legend>
            <label class="radio"><input type="radio" name="layout" value="treble" /> ト音記号</label>
            <label class="radio"><input type="radio" name="layout" value="bass" /> ヘ音記号</label>
            <label class="radio"><input type="radio" name="layout" value="grand" /> 大譜表（上下ランダム）</label>
          </fieldset>
          <fieldset>
            <legend>音域</legend>
            <div id="range-treble" class="range-row">
              <span class="range-name">ト音記号</span>
              <select id="range-treble-low" aria-label="ト音記号の最低音"></select>
              <span>〜</span>
              <select id="range-treble-high" aria-label="ト音記号の最高音"></select>
            </div>
            <div id="range-bass" class="range-row">
              <span class="range-name">ヘ音記号</span>
              <select id="range-bass-low" aria-label="ヘ音記号の最低音"></select>
              <span>〜</span>
              <select id="range-bass-high" aria-label="ヘ音記号の最高音"></select>
            </div>
          </fieldset>
          <fieldset>
            <legend>調号・臨時記号</legend>
            <div class="row">
              <label class="radio"><input type="radio" name="keyKind" value="none" /> 調号なし</label>
              <label class="radio"><input type="radio" name="keyKind" value="fixed" /> 指定</label>
              <label class="radio"><input type="radio" name="keyKind" value="random" /> 問題ごとにランダム</label>
            </div>
            <div class="row">
              <label id="key-fifths-label">指定する調 <select id="key-fifths"></select></label>
              <label id="key-max-label">ランダムの範囲
                <select id="key-max">
                  <option value="1">♯・♭ 1つまで</option>
                  <option value="2">♯・♭ 2つまで</option>
                  <option value="3">♯・♭ 3つまで</option>
                  <option value="4">♯・♭ 4つまで</option>
                  <option value="5">♯・♭ 5つまで</option>
                  <option value="6">♯・♭ 6つまで</option>
                  <option value="7">♯・♭ 7つまで</option>
                </select>
              </label>
            </div>
            <label class="check"><input id="accidentals" type="checkbox" /> 臨時記号（♯・♭・♮）を混ぜる</label>
          </fieldset>
          <fieldset>
            <legend>出題の長さ・判定</legend>
            <div class="row">
              <label class="radio"><input type="radio" name="limitKind" value="count" /> 問題数で区切る</label>
              <label class="radio"><input type="radio" name="limitKind" value="time" /> 時間で区切る</label>
            </div>
            <div class="row">
              <label id="count-label">問題数 <input id="count" type="number" min="1" max="500" /> 問</label>
              <label id="seconds-label">制限時間 <input id="seconds" type="number" min="10" max="3600" step="10" /> 秒</label>
            </div>
            <label class="check"><input id="octave-eq" type="checkbox" /> オクターブ違いを正解とみなす</label>
          </fieldset>
        </form>
        <button id="start" class="primary">はじめる <kbd>Enter</kbd></button>
      </section>

      <section id="practice" class="panel" hidden>
        <div class="practice-head">
          <div id="progress"></div>
          <div id="key-name" class="key-name"></div>
          <button id="stop">終了 <kbd>Esc</kbd></button>
        </div>
        <div id="staff" class="staff"></div>
        <div class="practice-foot">
          <div id="feedback" aria-live="polite"></div>
          <div id="reaction"></div>
        </div>
      </section>

      <section id="result" class="panel" hidden>
        <h2>結果</h2>
        <div id="summary" class="summary"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th id="col-key">調号</th><th>段</th><th>出題</th><th>最初に押した音</th><th>反応時間</th><th>押した回数</th></tr></thead>
            <tbody id="answers"></tbody>
          </table>
        </div>
        <div class="actions">
          <button id="again" class="primary">もう一度</button>
          <button id="back">設定に戻る</button>
        </div>
      </section>
    </main>

    <footer>
      <div id="keyboard"></div>
      <div id="octave" class="hint"></div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
